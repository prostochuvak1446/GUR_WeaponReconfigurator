// GUR - Gunsmith Utility & Reconfigurator (weapon stats mod) - updated for game patch 2.0.x
// Base: vanilla CharacterWeaponSettingsPrototypes.cfg.bin (converted 1:1 to text)
//
// This file sits next to the vanilla CharacterWeaponSettingsPrototypes.cfg.bin.
// That protoset ships only in binarized form, and for binarized prototypes the
// loader ignores *.cfg_patch_* files. Instead, plain *.cfg files found in the
// same folder are applied as patches (ZoneKit KB 145).
//
// NOTE: since 2.0 the PlayerWeaponSettingsPrototypes.cfg file no longer exists as
// a separate config - the *_Player / *_Player_WS sections are merged into
// CharacterWeaponSettingsPrototypes.cfg. This patch therefore targets that file.
//
// The GUR editor lists every player weapon and writes a {bpatch} block only for
// weapons whose stats differ from vanilla; untouched weapons have no block here.
// All unlisted fields, including new/renamed fields added by game patches, are
// inherited from vanilla because every block uses {bpatch} (merge children
// instead of replacing the node).
//
// The inventory bars (DamageUI / AccuracyUI / RangeUI) are computed by the GUR
// editor from BaseDamage / DispersionRadius / EffectiveFireDistanceMax, scaled
// against the vanilla values of the same weapon, so the inventory always matches
// what the weapon actually does. Do not edit those bars by hand.

GunM16_ST_Player : struct.begin {bpatch}
   BaseDamage = 73.0
   ArmorPiercing = 3.0
   EffectiveFireDistanceMin = 4000.0
   EffectiveFireDistanceMax = 4000.0
   DispersionRadius = 33.0
   DurabilityDamagePerShot = 0.54
   Accuracy = 0.0
   AlwaysPierce = false
   DamageUI = 0.91
   AccuracyUI = 1.00
   RangeUI = 0.59
struct.end

Gun_SkifGun_HG_Player_WS : struct.begin {bpatch}
   BaseDamage = 80.0
   ArmorPiercing = 3.0
   EffectiveFireDistanceMin = 4000.0
   EffectiveFireDistanceMax = 3000.0
   DispersionRadius = 189.0
   DurabilityDamagePerShot = 0.0
   Accuracy = 0.0
   AlwaysPierce = true
   DamageUI = 0.69
   AccuracyUI = 0.40
   RangeUI = 0.75
struct.end

GunKora_HG_Player : struct.begin {bpatch}
