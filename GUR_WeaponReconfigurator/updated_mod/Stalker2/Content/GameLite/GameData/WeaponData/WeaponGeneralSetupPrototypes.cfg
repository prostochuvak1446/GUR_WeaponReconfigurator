// GUR - Gunsmith Utility & Reconfigurator - WeaponGeneralSetupPrototypes
// updated for game patch 2.0.x
// Base: vanilla WeaponGeneralSetupPrototypes.cfg.bin (converted 1:1 to text)
//
// This file sits next to the vanilla WeaponGeneralSetupPrototypes.cfg.bin.
// For binarized prototypes the loader applies plain *.cfg files found in the
// same folder as patches (ZoneKit KB 145); *.cfg_patch_* is not searched.
//
// Only gameplay stat changes of the old mod are ported. Outdated attachment /
// upgrade / icon arrays of the old file are intentionally NOT ported.
// A762 / P762 (7.7x39) still exist in 2.0, so the Drowned conversion is kept as-is.
//
// No WeaponGeneralSetup overrides are currently shipped, so this patch is empty
// on purpose. It is kept so the editor can open and round-trip a general-setup
// document alongside the player stats document. The packer skips it while it has
// no sections: this file name is shared with other weapon mods, and shipping an
// empty override would replace their definitions at this virtual path.
